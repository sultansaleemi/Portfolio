<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Transparent background matching your portfolio theme -->

  <!-- Outer rotating arc - portfolio purple #7c7cff -->
  <circle cx="50" cy="50" r="40" fill="none" 
          stroke="#7c7cff" stroke-width="4.5" stroke-linecap="round"
          stroke-dasharray="155 95">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="4s"
      repeatCount="indefinite" />
  </circle>

  <!-- Inner counter-rotating arc - violet #8b5cf6 -->
  <circle cx="50" cy="50" r="31" fill="none" 
          stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="115 85">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 50 50"
      to="0 50 50"
      dur="3.2s"
      repeatCount="indefinite" />
  </circle>

  <!-- SMS text - light purple-white like your logo letters -->
  <text x="50" y="59" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="26" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#e8e8ff"
        letter-spacing="1">
    SMS
  </text>
</svg>
